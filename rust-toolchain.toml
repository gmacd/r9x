[toolchain]
channel = "nightly-2026-07-27"
components = ["rustfmt", "rust-analyzer", "rust-src", "clippy", "llvm-tools"]
targets = [
    # For building kernel
    "aarch64-unknown-none",
    "riscv64gc-unknown-none-elf",
    "x86_64-unknown-none",
    # For checking aarch64's tests and benches, which need std, on a host
    # that is not aarch64.  riscv64 and x86_64 have no tests and do not
    # build for a foreign host, so they get no such target.
    "aarch64-unknown-linux-gnu",
]
