name: xtask

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Pinned to an x86-64 label: cargo xtask test runs the host arch's
    # unit tests, so this job carries the x86-64 half of that coverage
    # (aarch64-tests the other) only while its runner stays x86-64 -- a
    # floating ubuntu-latest could repoint it silently.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-cache
      - name: Run fmt
        run: cargo xtask fmt --check
      - name: Run check
        run: cargo xtask check
      - name: Run tests
        run: cargo xtask test

  aarch64-tests:
    # Arch unit tests execute, so TestStep runs an arch package only on
    # its native host; checks cross-compiles the aarch64 tests via
    # aarch64-unknown-linux-gnu but cannot run them.  No QEMU is
    # involved, hence no ubuntu-26.04 requirement.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-cache
      - name: Run tests
        run: cargo xtask test

  arch-ci:
    # The aarch64 images boot a raspi4b, and the qemu 8.2 in
    # ubuntu-latest (24.04) does not provide that machine; the qemu 10.2
    # in ubuntu-26.04 does.
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      matrix:
        arch: [aarch64, riscv64, x86-64]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-cache
      - name: Prepare apt package cache
        # The .debs from a fast run are reused by later ones, so a slow
        # apt mirror stops mattering once the cache is warm.  The tree is
        # chowned recursively because apt's partial directory is 700 and
        # the cache save, which runs as the runner user, cannot read it.
        run: sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives
      - uses: actions/cache@v6
        # The key is unique per run so the save is never skipped as an
        # exact hit: the .debs apt wants advance with the runner image,
        # and a frozen cache would decay into full re-downloads while
        # still looking warm.  restore-keys starts each run from the
        # newest previous save.
        with:
          path: /var/cache/apt/archives
          key: apt-qemu-2604-${{ github.run_id }}
          restore-keys: |
            apt-qemu-2604-
      - name: Install QEMU
        # apt has no idea when to give up, and a stalled mirror must not
        # hang the run: bound every call, and let install proceed on the
        # image's own package lists if update does not finish in time.
        run: |
          sudo timeout -k 30 120 apt-get update || echo "warning: apt-get update timed out; using the image's package lists"
          sudo DEBIAN_FRONTEND=noninteractive timeout -k 120 480 apt-get install -y qemu-system-arm qemu-system-riscv qemu-system-x86
          qemu-system-aarch64 --version
          qemu-system-riscv64 --version
          qemu-system-x86_64 --version
          # apt recreated its 700 _apt-owned subdirectories during the
          # install, which would make the cache save fail to read them:
          # hand the tree back to the runner user before the job ends.
          sudo chown -R "$(id -u):$(id -g)" /var/cache/apt/archives
      - name: Clippy
        run: cargo xtask clippy --arch ${{ matrix.arch }} --verbose
      - name: Dist
        run: cargo xtask dist --arch ${{ matrix.arch }} --verbose
      - name: Integration Test
        run: cargo xtask integration-test --arch ${{ matrix.arch }} --verbose
