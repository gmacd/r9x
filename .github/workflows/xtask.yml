name: xtask

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Cache the toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Run fmt
        run: cargo xtask fmt --check
      - name: Run check
        run: cargo xtask check
      - name: Run tests
        run: cargo xtask test

  arch-ci:
    # The aarch64 images boot a raspi4b, and the qemu 8.2 in
    # ubuntu-latest (24.04) does not provide that machine; the qemu 10.2
    # in ubuntu-26.04 does.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      matrix:
        arch: [aarch64, riscv64, x86-64]
    steps:
      - uses: actions/checkout@v6
      - name: Cache the toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
            ~/.rustup/settings.toml
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Install QEMU
        # apt has no idea when to give up, and a stalled mirror must not
        # hang the run: bound every call, and let install proceed on the
        # image's own package lists if update does not finish in time.
        run: |
          sudo timeout -k 60 300 apt-get update || echo "warning: apt-get update timed out; using the image's package lists"
          sudo DEBIAN_FRONTEND=noninteractive timeout -k 120 600 apt-get install -y qemu-system-arm qemu-system-riscv qemu-system-x86
      - name: Clippy
        run: cargo xtask clippy --arch ${{ matrix.arch }} --verbose
      - name: Dist
        run: cargo xtask dist --arch ${{ matrix.arch }} --verbose
      - name: Integration Test
        run: cargo xtask integration-test --arch ${{ matrix.arch }} --verbose
