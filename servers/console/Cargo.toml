cargo-features = ["per-package-target"]

[package]
name = "console"
version = "0.1.0"
edition = "2024"
# Cross-linted the way the kernel is: `clippy --workspace` builds it for this
# target.  The *artifact* build (xtask's ServerStep) overrides it with the
# bare-metal JSON spec plus the static / --image-base / -e link flags.
default-target = "aarch64-unknown-none"

# A user-space server: a bare-metal `no_std` bin the kernel loads as an ELF
# (the user-binary-loading plan).  The first real server — it maps the PL011
# UART into its own address space, writes a byte, and exits.  It is
# aarch64-only for the arc: the per-process `Aspace` the loader needs has only
# landed for aarch64, so the other arches' servers appear when their `Aspace`
# lands.  Built by `cargo xtask` (ServerStep), not by a bare `cargo build`.
#
# No std, no alloc, no dependencies: the server is `core` plus a tiny syscall
# shim.  It knows its own platform (the PL011 address is a BCM2711 constant)
# and requests its MMIO mapping itself — the kernel is device-dumb (QNX model).

[lints]
workspace = true
